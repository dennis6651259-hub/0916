<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SYS_01 // 王鼎昌 // ACTIVE</title>
  <meta name="description" content="王鼎昌 電機工程 個人系統終端機">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&family=Orbitron:wght@400;700;900&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
  <style>
    /* ======== RESET ======== */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    /* ======== ROOT ======== */
    :root {
      --cyan:   #00f5ff;
      --cyan2:  #00bcd4;
      --yellow: #f5c518;
      --red:    #ff2d55;
      --green:  #39ff14;
      --bg:     #050a0f;
      --panel:  rgba(0, 20, 30, 0.85);
      --border: #00f5ff;
      --text:   #c8f4ff;
      --mono:   'Share Tech Mono', 'Courier New', monospace;
      --orb:    'Orbitron', monospace;
    }

    html, body {
      width: 100%; height: 100%;
      background: var(--bg);
      color: var(--text);
      font-family: var(--mono);
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ======== SCANLINES overlay ======== */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: repeating-linear-gradient(
        to bottom,
        transparent 0px,
        transparent 3px,
        rgba(0,245,255,0.025) 3px,
        rgba(0,245,255,0.025) 4px
      );
      pointer-events: none;
      z-index: 999;
    }

    /* ======== GRID BACKGROUND ======== */
    body::after {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(0,245,255,0.04) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,245,255,0.04) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      z-index: 0;
    }

    /* ======== MAIN TERMINAL WINDOW ======== */
    .terminal {
      position: relative;
      z-index: 10;
      width: min(620px, 96vw);
      background: var(--panel);
      border: 2px solid var(--cyan);
      box-shadow:
        0 0 0 1px rgba(0,245,255,0.15),
        0 0 30px rgba(0,245,255,0.25),
        inset 0 0 60px rgba(0,245,255,0.04);
      padding: 0;
      animation: flicker 8s step-end infinite;
    }

    @keyframes flicker {
      0%,96%,98%,100% { opacity: 1; }
      97%             { opacity: 0.85; }
      99%             { opacity: 0.92; }
    }

    /* ---- status bar ---- */
    .status-bar {
      background: rgba(0,245,255,0.08);
      border-bottom: 1px solid var(--cyan2);
      padding: 5px 14px;
      font-size: 0.72rem;
      color: var(--cyan2);
      letter-spacing: 0.12em;
      display: flex;
      justify-content: space-between;
    }

    .status-dot {
      display: inline-block;
      width: 7px; height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 6px var(--green);
      margin-right: 6px;
      animation: pulse 1.5s ease-in-out infinite;
    }

    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }

    /* ---- body content ---- */
    .terminal-body {
      padding: 24px 28px 22px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    /* ---- NAME ---- */
    .name-block {
      text-align: center;
    }

    .name-kanji {
      font-family: 'Noto Sans TC', sans-serif;
      font-size: clamp(2.8rem, 8vw, 4rem);
      font-weight: 900;
      color: var(--yellow);
      text-shadow:
        0 0 12px rgba(245,197,24,0.8),
        0 0 30px rgba(245,197,24,0.4);
      letter-spacing: 0.08em;
      line-height: 1.1;
    }

    .name-sub {
      font-family: var(--mono);
      font-size: 0.88rem;
      color: var(--cyan2);
      letter-spacing: 0.18em;
      margin-top: 6px;
    }

    .name-sub span { color: var(--cyan); margin: 0 8px; }

    /* ---- PANELS ROW ---- */
    .panels-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .panel {
      border: 1px solid var(--cyan2);
      background: rgba(0,245,255,0.04);
      padding: 12px 14px;
      position: relative;
    }

    /* dashed red bottom accent */
    .panel::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        var(--red) 0px, var(--red) 6px,
        transparent 6px, transparent 10px
      );
    }

    .panel-label {
      font-size: 0.68rem;
      color: var(--cyan);
      letter-spacing: 0.15em;
      margin-bottom: 10px;
    }

    .panel-label::before { content: '>> '; }

    /* SYSTEM_ID panel */
    .sys-nid {
      font-size: 0.82rem;
      color: var(--cyan2);
      margin-bottom: 4px;
    }

    .sys-nid strong {
      color: var(--yellow);
      font-size: 1rem;
      letter-spacing: 0.08em;
    }

    .sys-status {
      font-size: 0.82rem;
      color: var(--cyan2);
    }

    .sys-status strong {
      color: var(--green);
      font-size: 0.9rem;
      text-shadow: 0 0 8px var(--green);
      letter-spacing: 0.1em;
    }

    /* SKILL TREE panel */
    .skill-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-top: 4px;
    }

    .skill-tag {
      border: 1px solid var(--yellow);
      color: var(--yellow);
      background: rgba(245,197,24,0.08);
      padding: 3px 12px;
      font-size: 0.78rem;
      letter-spacing: 0.08em;
      text-shadow: 0 0 6px rgba(245,197,24,0.6);
      box-shadow: 0 0 6px rgba(245,197,24,0.1);
      cursor: default;
      transition: background 0.2s;
    }

    .skill-tag:hover {
      background: rgba(245,197,24,0.22);
    }

    /* ---- DATABANK ---- */
    .databank {
      border: 1px solid var(--cyan2);
      background: rgba(0,245,255,0.03);
      padding: 12px 14px;
      position: relative;
    }

    .databank::after {
      content: '';
      position: absolute;
      bottom: 0; left: 0; right: 0;
      height: 2px;
      background: repeating-linear-gradient(
        90deg,
        var(--red) 0px, var(--red) 6px,
        transparent 6px, transparent 10px
      );
    }

    .databank-label {
      font-size: 0.68rem;
      color: var(--cyan);
      letter-spacing: 0.15em;
      margin-bottom: 8px;
      text-align: center;
    }

    .databank-label::before { content: '>> '; }

    .project-entry {
      font-size: 0.88rem;
      color: var(--text);
      letter-spacing: 0.06em;
      text-align: center;
    }

    .project-entry::before { content: '>> '; color: var(--cyan2); }

    /* ---- CLOCK PANEL ---- */
    .clock-panel {
      border: 2px solid var(--red);
      background: rgba(255,45,85,0.05);
      padding: 16px 20px 12px;
      text-align: center;
      box-shadow: inset 0 0 24px rgba(255,45,85,0.06);
    }

    .clock-time {
      font-family: var(--orb);
      font-size: clamp(2rem, 7vw, 2.8rem);
      font-weight: 700;
      color: var(--cyan);
      text-shadow:
        0 0 16px rgba(0,245,255,0.9),
        0 0 40px rgba(0,245,255,0.4);
      letter-spacing: 0.06em;
    }

    .clock-date {
      font-size: 0.8rem;
      color: var(--cyan2);
      margin-top: 5px;
      letter-spacing: 0.12em;
    }

    /* ---- ACCESS BUTTON ---- */
    .access-btn {
      width: 100%;
      padding: 13px;
      background: var(--yellow);
      border: none;
      color: #000;
      font-family: var(--orb);
      font-size: 0.95rem;
      font-weight: 700;
      letter-spacing: 0.18em;
      cursor: pointer;
      transition: all 0.2s;
      box-shadow: 0 0 18px rgba(245,197,24,0.5);
      text-transform: uppercase;
    }

    .access-btn:hover {
      background: #fff700;
      box-shadow: 0 0 32px rgba(245,197,24,0.9);
      letter-spacing: 0.22em;
    }

    .access-btn:active {
      transform: scale(0.98);
    }

    /* corner decorations */
    .corner {
      position: absolute;
      width: 14px; height: 14px;
      border-color: var(--cyan);
      border-style: solid;
    }
    .corner.tl { top: -2px; left: -2px; border-width: 3px 0 0 3px; }
    .corner.tr { top: -2px; right: -2px; border-width: 3px 3px 0 0; }
    .corner.bl { bottom: -2px; left: -2px; border-width: 0 0 3px 3px; }
    .corner.br { bottom: -2px; right: -2px; border-width: 0 3px 3px 0; }
  </style>
</head>
<body>

  <div class="terminal">
    <!-- corner decorations -->
    <div class="corner tl"></div>
    <div class="corner tr"></div>
    <div class="corner bl"></div>
    <div class="corner br"></div>

    <!-- status bar -->
    <div class="status-bar">
      <span><span class="status-dot"></span>SYS_01_ACTIVE</span>
      <span id="sys-time-small">--:--:--</span>
    </div>

    <!-- body -->
    <div class="terminal-body">

      <!-- NAME -->
      <div class="name-block">
        <div class="name-kanji">王鼎昌</div>
        <div class="name-sub">電機工程學系<span>//</span>學生</div>
      </div>

      <!-- INFO ROW -->
      <div class="panels-row">
        <!-- System ID -->
        <div class="panel">
          <div class="panel-label">SYSTEM_ID</div>
          <div class="sys-nid">NID: <strong>7115064172</strong></div>
          <div class="sys-status">STATUS: <strong>ACTIVE</strong></div>
        </div>

        <!-- Skill Tree -->
        <div class="panel">
          <div class="panel-label">SKILL_TREE</div>
          <div class="skill-tags">
            <span class="skill-tag">Python</span>
            <span class="skill-tag">C</span>
            <span class="skill-tag">C++</span>
            <span class="skill-tag">Web Dev</span>
          </div>
        </div>
      </div>

      <!-- Databank -->
      <div class="databank">
        <div class="databank-label">DATABANK: UNIV_PROJECTS</div>
        <div class="project-entry">MEC</div>
      </div>

      <!-- Clock -->
      <div class="clock-panel">
        <div class="clock-time" id="clock-time">00:00:00</div>
        <div class="clock-date" id="clock-date">載入中...</div>
      </div>

      <!-- Button -->
      <button class="access-btn" onclick="accessDatabank()">ACCESS DATABANK</button>

    </div>
  </div>

  <script>
    const weekdays = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];

    function pad(n) { return String(n).padStart(2, '0'); }

    function updateClock() {
      const now = new Date();
      const h = pad(now.getHours());
      const m = pad(now.getMinutes());
      const s = pad(now.getSeconds());
      const timeStr = `${h}:${m}:${s}`;
      const dateStr = `${now.getFullYear()}年${now.getMonth()+1}月${now.getDate()}日 ${weekdays[now.getDay()]}`;

      document.getElementById('clock-time').textContent = timeStr;
      document.getElementById('clock-date').textContent = dateStr;
      document.getElementById('sys-time-small').textContent = timeStr;
    }

    updateClock();
    setInterval(updateClock, 1000);

    function accessDatabank() {
      const btn = document.querySelector('.access-btn');
      btn.textContent = '>> ACCESSING... MEC <<';
      btn.style.background = '#00f5ff';
      btn.style.color = '#000';
      setTimeout(() => {
        btn.textContent = '>> MEC // LOADED ✓';
        btn.style.background = '#39ff14';
      }, 800);
      setTimeout(() => {
        btn.textContent = 'ACCESS DATABANK';
        btn.style.background = '#f5c518';
        btn.style.color = '#000';
      }, 2500);
    }
  </script>
</body>
</html>
